# This template is rendered at container startup, never during the frontend build.
proxy_cache_path /var/cache/nginx/uptime levels=1:2 keys_zone=uptime:1m max_size=5m inactive=2m;
limit_req_zone $binary_remote_addr zone=uptime_clients:1m rate=10r/s;

server {
    listen 80;
    # Слушаем и IPv6: healthcheck ходит на localhost, который в контейнере
    # резолвится в [::1] — без этой строки wget получает Connection refused
    # и контейнер стабильно уходит в unhealthy (#3024 в репозитории бота).
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fixed public read-only endpoints; arbitrary /api/admin paths stay inaccessible.
    location ~ ^/status-api/(?<uptime_route>public|summary|events)$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        set $uptime_key "${XSG_UPTIME_API_KEY}";
        if ($uptime_key = "") { return 503; }

        limit_req zone=uptime_clients burst=50 nodelay;
        limit_req_status 429;
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $uptime_host uptime.xsgvpn.ru;
        proxy_pass https://$uptime_host/api/$uptime_route;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $uptime_host;
        proxy_set_header Accept application/json;
        proxy_set_header Authorization "Bearer $uptime_key";
        proxy_ssl_server_name on;
        proxy_ssl_name $uptime_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 3s;

        # Shared cache keeps many visitors below the upstream key's 120/min limit.
        # A failed refresh never serves an expired successful response.
        proxy_cache uptime;
        proxy_cache_key "uptime-$uptime_route";
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        proxy_cache_lock_age 15s;
        proxy_cache_use_stale off;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        proxy_intercept_errors on;
        error_page 301 302 307 308 400 401 403 404 429 500 502 503 504 =503 /status-api-unavailable;
    }

    location = /status-api-unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"ok":false}';
    }

    location /status-api/ { return 404; }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # index.html правится на старте контейнера (docker/40-cabinet-brand.sh) и
    # содержит хэши ассетов: закешированная копия показывала бы старый бренд и
    # тянула бы удалённые бандлы. Сами ассеты кешируются на год ниже.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API проксировать, если нужно
    location /api/ {
        try_files $uri /index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: кэширование статических файлов
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
